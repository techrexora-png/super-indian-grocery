<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-labelledby="aboutImgTitle">
  <title id="aboutImgTitle">Illustration of grocery shelves stocked with spice jars, packets and pantry staples</title>
  <defs>
    <linearGradient id="shelfBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCEBC9"/>
      <stop offset="100%" stop-color="#F6E3BC"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F3324"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="560" height="480" rx="24" fill="url(#shelfBg)"/>

  <!-- shelves -->
  <g>
    <rect x="40" y="150" width="480" height="14" rx="4" fill="url(#wood)"/>
    <rect x="40" y="290" width="480" height="14" rx="4" fill="url(#wood)"/>
    <rect x="40" y="430" width="480" height="14" rx="4" fill="url(#wood)"/>
  </g>

  <!-- top row: spice jars -->
  <g>
    <g transform="translate(70,90)">
      <rect x="0" y="20" width="46" height="60" rx="6" fill="#E08A00"/>
      <rect x="6" y="10" width="34" height="14" rx="4" fill="#0F3324"/>
      <rect x="8" y="40" width="30" height="18" rx="3" fill="#FCEBC9" opacity="0.85"/>
    </g>
    <g transform="translate(140,84)">
      <rect x="0" y="26" width="46" height="66" rx="6" fill="#A62639"/>
      <rect x="6" y="16" width="34" height="14" rx="4" fill="#0F3324"/>
      <rect x="8" y="50" width="30" height="18" rx="3" fill="#FCEBC9" opacity="0.85"/>
    </g>
    <g transform="translate(210,94)">
      <rect x="0" y="16" width="46" height="56" rx="6" fill="#2D6A4F"/>
      <rect x="6" y="6" width="34" height="14" rx="4" fill="#0F3324"/>
      <rect x="8" y="36" width="30" height="18" rx="3" fill="#FCEBC9" opacity="0.85"/>
    </g>
    <g transform="translate(300,80)">
      <rect x="0" y="30" width="60" height="70" rx="8" fill="#F4A300"/>
      <rect x="8" y="18" width="44" height="16" rx="4" fill="#0F3324"/>
      <circle cx="30" cy="65" r="16" fill="#FCEBC9" opacity="0.8"/>
    </g>
    <g transform="translate(390,86)">
      <rect x="0" y="24" width="46" height="64" rx="6" fill="#C1272D"/>
      <rect x="6" y="14" width="34" height="14" rx="4" fill="#0F3324"/>
      <rect x="8" y="48" width="30" height="18" rx="3" fill="#FCEBC9" opacity="0.85"/>
    </g>
    <g transform="translate(460,92)">
      <rect x="0" y="18" width="46" height="58" rx="6" fill="#0F3324"/>
      <rect x="6" y="8" width="34" height="14" rx="4" fill="#F4A300"/>
      <rect x="8" y="38" width="30" height="18" rx="3" fill="#FCEBC9" opacity="0.85"/>
    </g>
  </g>

  <!-- middle row: packets -->
  <g>
    <rect x="65" y="220" width="70" height="58" rx="6" fill="#2D6A4F"/>
    <rect x="145" y="212" width="66" height="66" rx="6" fill="#F4A300"/>
    <rect x="221" y="224" width="60" height="54" rx="6" fill="#A62639"/>
    <rect x="291" y="210" width="74" height="68" rx="6" fill="#0F3324"/>
    <rect x="375" y="222" width="64" height="56" rx="6" fill="#E08A00"/>
    <rect x="449" y="216" width="58" height="62" rx="6" fill="#2D6A4F"/>
    <g fill="#FBF8F3" opacity="0.85">
      <rect x="78" y="238" width="44" height="8" rx="3"/>
      <rect x="160" y="232" width="36" height="8" rx="3"/>
      <rect x="234" y="242" width="34" height="8" rx="3"/>
      <rect x="306" y="230" width="44" height="8" rx="3"/>
      <rect x="388" y="240" width="38" height="8" rx="3"/>
      <rect x="462" y="234" width="32" height="8" rx="3"/>
    </g>
  </g>

  <!-- bottom row: rice/flour bags -->
  <g>
    <path d="M60 360 h90 l-6 60 c-1 6 -6 10 -12 10 h-64 c-6 0 -11 -4 -12 -10 Z" fill="#F6E3BC" stroke="#0F3324" stroke-width="3"/>
    <path d="M170 360 h90 l-6 60 c-1 6 -6 10 -12 10 h-64 c-6 0 -11 -4 -12 -10 Z" fill="#FCEBC9" stroke="#0F3324" stroke-width="3"/>
    <path d="M280 360 h90 l-6 60 c-1 6 -6 10 -12 10 h-64 c-6 0 -11 -4 -12 -10 Z" fill="#F6E3BC" stroke="#0F3324" stroke-width="3"/>
    <path d="M390 360 h90 l-6 60 c-1 6 -6 10 -12 10 h-64 c-6 0 -11 -4 -12 -10 Z" fill="#FCEBC9" stroke="#0F3324" stroke-width="3"/>
    <g fill="#1B4332" opacity="0.8">
      <rect x="82" y="378" width="46" height="10" rx="3"/>
      <rect x="192" y="378" width="46" height="10" rx="3"/>
      <rect x="302" y="378" width="46" height="10" rx="3"/>
      <rect x="412" y="378" width="46" height="10" rx="3"/>
    </g>
  </g>
</svg>
